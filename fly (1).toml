# fly.toml - Configuracion para Fly.io
# Docs: https://fly.io/docs/reference/configuration/
# Uso: fly launch --dockerfile Dockerfile
#      fly deploy

app = 'museo-virtual'
primary_region = 'gru'  # Sao Paulo (cercano a Latinoamerica)

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "museo_data"
  destination = "/app/uploads"
